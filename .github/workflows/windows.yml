name: Windows build

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: windows/build/cef
          key: cef-${{ runner.os }}-${{ hashFiles('windows/cmake/DownloadCEF.cmake') }}

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/configure.log"
          exit $LASTEXITCODE

      - name: Report configure errors
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/configure.log"
          if (Test-Path $log) {
            $text = (Get-Content $log -Raw) -replace "`r?`n", " | "
            $m = [regex]::Match($text, "CMake Error.{0,600}")
            if ($m.Success) { Write-Host "::error::$($m.Value)" }
          }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/build.log"
          exit $LASTEXITCODE

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/build.log"
          if (Test-Path $log) {
            Select-String -Path $log -Pattern "error [A-Z]+[0-9]+|fatal error|: error |CMake Error|LNK[0-9]+" |
              ForEach-Object { $_.Line.Trim() -replace [regex]::Escape($env:GITHUB_WORKSPACE), "" } |
              Select-Object -Unique -First 15 |
              ForEach-Object { Write-Host "::error::$($_.Substring(0, [Math]::Min(380, $_.Length)))" }
          }

      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate output
        shell: pwsh
        run: |
          $dir = "build/Release"
          foreach ($f in "materialex.exe", "libcef.dll", "chrome_elf.dll", "icudtl.dat", "resources.pak", "v8_context_snapshot.bin") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing $f" }
          }
          $size = (Get-ChildItem $dir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Output size: $([math]::Round($size / 1MB, 1)) MB"

      - name: Launch smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class WinProbe {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            public static List<string> Find(uint pid, bool close) {
              var found = new List<string>();
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid) {
                  var cls = new StringBuilder(128); GetClassName(h, cls, 128);
                  var txt = new StringBuilder(256); GetWindowText(h, txt, 256);
                  if (cls.ToString() == "MaterialEXMainWindow") {
                    found.Add(cls + ":" + txt + ":visible=" + IsWindowVisible(h));
                    if (close) PostMessage(h, 0x0010, IntPtr.Zero, IntPtr.Zero);
                  }
                }
                return true;
              }, IntPtr.Zero);
              return found;
            }
          }
          "@
          $failed = $null
          $p = Start-Process -FilePath "build/Release/materialex.exe" -ArgumentList "about:blank" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            $failed = "exited early with code $($p.ExitCode)"
          } else {
            $windows = [WinProbe]::Find([uint32]$p.Id, $true)
            Write-Host "Main windows: $($windows -join ', ')"
            if ($windows.Count -eq 0) {
              Stop-Process -Id $p.Id -Force
              $failed = "no main window was created"
            } elseif (-not $p.WaitForExit(30000)) {
              Stop-Process -Id $p.Id -Force
              $failed = "did not exit after closing the main window"
            } elseif ($p.ExitCode -ne 0) {
              $failed = "exit code $($p.ExitCode)"
            }
          }
          $logPath = Join-Path $env:LOCALAPPDATA "MaterialEX\debug.log"
          $logText = if (Test-Path $logPath) { (Get-Content $logPath -Tail 5) -join " | " } else { "no debug.log" }
          if ($failed) {
            Write-Host "::error::Smoke test: $failed. Log: $logText"
            exit 1
          }
          Write-Host "Clean exit."

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath materialex-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: materialex-windows-x64
          path: windows/materialex-windows-x64.zip
