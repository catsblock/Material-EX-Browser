name: Android instrumented tests

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-instrumented.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare Android SDK
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile instrumented tests
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/gradle-androidtest.log"

      - name: Report compile errors
        if: failure()
        run: |
          { grep -A12 "What went wrong" "$RUNNER_TEMP/gradle-androidtest.log" | cut -c1-300 | tr '\n' '~' | sed 's/~/ | /g'; echo; grep -E "^e: " "$RUNNER_TEMP/gradle-androidtest.log" | sed 's#/home/runner/work/Material-EX-Browser/Material-EX-Browser/##' | cut -c1-300 | awk '!seen[$0]++' | head -n 10; } | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest

      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          files = glob.glob("android/app/build/outputs/androidTest-results/**/*.xml", recursive=True)
          if not files:
              print("::error::no instrumented test result files")
          for f in files:
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.iter("failure")) + list(case.iter("error")):
                      print("::error::%s.%s: %s" % (case.get("classname"), case.get("name"), (bad.get("message") or "")[:250]))
          PY
