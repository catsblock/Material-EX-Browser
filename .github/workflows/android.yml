name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["windows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/gradle-unit.log"

      - name: Report build errors
        if: failure()
        run: |
          { grep -A12 "What went wrong" "$RUNNER_TEMP/gradle-unit.log" | cut -c1-300 | tr '\n' '~' | sed 's/~/ | /g'; echo; grep -E "^e: " "$RUNNER_TEMP/gradle-unit.log" | sed 's#/home/runner/work/Material-EX-Browser/Material-EX-Browser/##' | cut -c1-300 | awk '!seen[$0]++' | head -n 8; } | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done

      - name: Lint
        run: |
          set -o pipefail
          gradle --no-daemon lintDebug 2>&1 | tee "$RUNNER_TEMP/gradle-lint.log"

      - name: Report lint findings
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, re
          import xml.etree.ElementTree as ET
          files = glob.glob("**/lint-results-debug.xml", recursive=True)
          if not files:
              print("::error::lint xml report not found")
          for f in files[:1]:
              seen = set()
              for issue in ET.parse(f).getroot().iter("issue"):
                  if issue.get("severity") not in ("Error", "Fatal"):
                      continue
                  loc = issue.find("location")
                  where = ""
                  if loc is not None:
                      where = re.sub(r".*/(app/src/)", r"\1", loc.get("file", "")) + ":" + str(loc.get("line", ""))
                  msg = "[%s] %s %s" % (issue.get("id"), where, issue.get("message", "")[:200])
                  if msg not in seen:
                      seen.add(msg)
                      print("::error::" + msg)
                  if len(seen) >= 30:
                      break
          PY

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-assemble.log"

      - name: Report assemble errors
        if: failure()
        run: |
          { grep -A12 "What went wrong" "$RUNNER_TEMP/gradle-assemble.log" | cut -c1-300 | tr '\n' '~' | sed 's/~/ | /g'; echo; grep -E "^e: " "$RUNNER_TEMP/gradle-assemble.log" | sed 's#/home/runner/work/Material-EX-Browser/Material-EX-Browser/##' | cut -c1-300 | awk '!seen[$0]++' | head -n 8; } | while IFS= read -r line; do [ -n "$line" ] && echo "::error::$line"; done

      - name: Validate APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$apk"
          unzip -tq "$apk"
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)" verify "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/MaterialEX-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: materialex-android-apk
          path: dist/*.apk
          if-no-files-found: error
