name: Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$apk"
          unzip -tq "$apk"
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)" verify "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/MaterialEX-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: materialex-android-apk
          path: dist/*.apk
          if-no-files-found: error
