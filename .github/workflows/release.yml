name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark as pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        run: |
          echo "${{ inputs.tag }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Validate APK
        env:
          TAG: ${{ inputs.tag }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          test -s "$apk"
          unzip -tq "$apk"
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)" verify "$apk"
          mkdir -p ../dist
          cp "$apk" "../dist/MaterialEX-${TAG}-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
